name: CI

# Vérifie le produit à chaque poussée et à chaque pull request.
# Le VPS déploie automatiquement ce qui arrive sur main : ce garde-fou est donc
# la dernière étape avant la production.

on:
  push:
    branches: [main, 'claude/**']
    paths: ['product/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['product/**', '.github/workflows/ci.yml']
  workflow_dispatch:

# Une poussée plus récente annule la vérification précédente de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: product

jobs:
  verify:
    name: Typecheck · tests · build
    runs-on: ubuntu-latest
    # Délai mesuré, pas posé d'instinct. Durée du job sur les 11 dernières CI
    # réussies de main (2026-11-01/02) : 631 à 1151 s, médiane 1050 s ; la
    # 12e (72e9fa4) a été coupée à 1217 s avec toutes ses étapes vertes. Le
    # runner varie du simple au double : 35 min laissent ~1,8x le maximum mesuré.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: product/pnpm-lock.yaml

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      # Le build Next ne touche ni la base ni les API : les variables absentes
      # sont traitées comme « intégration non configurée », pas comme une erreur.
      - name: Build
        run: pnpm build
