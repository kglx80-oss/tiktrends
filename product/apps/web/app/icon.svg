<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Favicon · le même dégradé d'accent que le logo du rail et les boutons primaires
       (accent et accent 2 de :root, spatial.css), un T blanc sur une pastille arrondie. -->
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f73"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="10" fill="url(#acc)"/>
  <rect width="32" height="32" rx="10" fill="url(#reflet)"/>
  <path d="M9.5 11h13M16 11v11.5" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" fill="none"/>
</svg>
