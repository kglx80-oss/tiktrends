# Déploiement OVH — 1 VPS suffit pour démarrer (EU, RGPD).
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tiktrends
      POSTGRES_USER: tiktrends
    # Le mot de passe vient de .env.deploy (POSTGRES_PASSWORD), pas d'interpolation.
    env_file: .env.deploy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiktrends -d tiktrends"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    # BUILD_SHA vient de l'environnement du déploiement · le timer l'exporte
    # (git rev-parse) AVANT `docker compose up --build`. Absent, le bandeau dit
    # « inconnu » sans casser le reste (CDC · Lot 0).
    build: { context: ., dockerfile: Dockerfile.web, args: { BUILD_SHA: "${BUILD_SHA-}" } }
    restart: unless-stopped
    env_file: .env.deploy
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  workers:
    build: { context: ., dockerfile: Dockerfile.workers }
    restart: unless-stopped
    env_file: .env.deploy
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web]

volumes:
  pgdata:
  redisdata:
  caddydata:
